name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows package
        run: npm run package:win

      - name: Create ZIP
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE 'out\vanilla-deck-win32-x64'
          $zip = Join-Path $env:GITHUB_WORKSPACE 'out\vanilla-deck-win32-x64.zip'
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path $source -DestinationPath $zip -Force

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: out/vanilla-deck-win32-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
